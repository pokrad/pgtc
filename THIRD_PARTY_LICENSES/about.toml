# cargo-about configuration (D-017): licences of the Rust crates pgtc is built from.
# Regenerate after dependency changes (from the workspace root):
#   cargo about generate -c THIRD_PARTY_LICENSES/about.toml THIRD_PARTY_LICENSES/about.hbs -o THIRD_PARTY_LICENSES/rust-crates.txt

# only permissive licences (D-017); generation fails on anything else
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "PostgreSQL",
    "BSL-1.0",      # clipboard-win, error-code (arboard on Windows)
    "Unicode-3.0",  # Unicode data tables (unicode-ident, stringprep for SCRAM)
]

# the platforms pgtc is built for (D-003)
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# only what ends up in the program
ignore-build-dependencies = true
ignore-dev-dependencies = true

# pgtc's own crates (publish = false) are under pgtc's licence
private = { ignore = true }
